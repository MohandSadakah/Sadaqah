<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Task Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14141a; --bg-soft:#191922; --card:#1e1e28; --card-2:#23232f; --border:#2c2c3a;
    --text:#f1f1f5; --muted:#8d8da3;
    --gold:#ffc93c; --good:#35d48a; --danger:#e0617e; --purple:#9b6eff; --money:#2fc9c9;
  }
  :root[data-theme="light"]{
    --bg:#f3f3f9; --bg-soft:#ffffff; --card:#ffffff; --card-2:#f1f1f7; --border:#e2e2ec;
    --text:#1c1c26; --muted:#6b6b80;
    --gold:#c98a00; --good:#189a6c; --danger:#c93b5c; --purple:#7c4dff; --money:#0d9494;
  }
  .theme-toggle{
    position:fixed; top:14px; left:14px; z-index:50;
    background:var(--bg-soft); border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-size:17px; padding:0; cursor:pointer;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 20% -10%, rgba(62,139,255,.09), transparent 60%),
      radial-gradient(1200px 600px at 80% -10%, rgba(255,122,69,.09), transparent 60%), var(--bg);
    color:var(--text); font-family:'Tajawal', sans-serif; min-height:100vh; padding:20px 14px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header{text-align:center; margin-bottom:22px;}
  .eyebrow{color:var(--muted); font-size:13px; letter-spacing:1px; margin-bottom:6px;}
  h1{
    font-family:'Lalezar', sans-serif; font-weight:400; font-size:clamp(30px,7vw,48px); margin:0 0 4px; line-height:1.1;
    background:linear-gradient(90deg, var(--gold), var(--purple) 60%, var(--money));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color:var(--muted); font-size:14px;}
  a{color:inherit;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:16px;}
  .section-title{font-size:15px; font-weight:900; margin:0 0 12px; display:flex; align-items:center; gap:8px;}

  /* Login */
  #loginScreen{max-width:380px; margin:60px auto 0;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  select, input{
    width:100%; background:var(--bg-soft); border:1px solid var(--border); color:var(--text);
    font-family:'Tajawal'; font-size:15px; padding:11px 12px; border-radius:11px; margin-bottom:14px;
  }
  button{
    font-family:'Tajawal'; font-weight:800; font-size:14.5px; border:none; border-radius:11px;
    padding:11px 16px; cursor:pointer;
  }
  .btn-primary{width:100%; background:linear-gradient(90deg, var(--purple), var(--money)); color:#0b0b10;}
  .btn-ghost{background:var(--bg-soft); border:1px solid var(--border); color:var(--text);}
  .login-err{color:var(--danger); font-size:13px; margin-bottom:10px; min-height:16px;}

  /* Leaderboard */
  .lb-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--border);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:24px; text-align:center; font-family:'Lalezar'; font-size:17px; color:var(--muted); flex-shrink:0;}
  .lb-rank.gold{color:var(--gold);}
  .avatar{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Lalezar'; font-size:18px; flex-shrink:0;}
  .lb-info{flex:1; min-width:0;}
  .lb-name{font-weight:900; font-size:14.5px;}
  .lb-bar-track{height:7px; border-radius:99px; background:var(--card-2); overflow:hidden; margin-top:5px; border:1px solid var(--border);}
  .lb-bar-fill{height:100%; border-radius:99px; transition:width .5s ease;}
  .lb-points{font-family:'Lalezar'; font-size:18px; flex-shrink:0; min-width:44px; text-align:left;}
  .lb-row.me{background:var(--card-2); border-radius:12px;}

  /* Tasks */
  .task{background:var(--card-2); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px;}
  .task.done{opacity:.55;}
  .task-row{display:flex; align-items:flex-start; gap:10px;}
  .check{
    width:24px; height:24px; border-radius:8px; border:2px solid var(--muted); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:transparent; transition:all .15s ease; margin-top:1px;
  }
  .check.checked{background:var(--good); border-color:var(--good);}
  .check svg{width:14px; height:14px; opacity:0;}
  .check.checked svg{opacity:1;}
  .task-text{font-size:14.5px; font-weight:700; line-height:1.5;}
  .task-text.strike{text-decoration:line-through; text-decoration-color:var(--muted); color:var(--muted);}
  .task-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .points-chip{font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:rgba(255,201,60,.14); color:var(--gold); border:1px solid rgba(255,201,60,.35);}
  .due-chip{font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:rgba(53,212,138,.12); color:var(--good); border:1px solid rgba(53,212,138,.35);}
  .due-chip.late{background:rgba(224,97,126,.14); color:var(--danger); border-color:rgba(224,97,126,.4);}
  .due-chip.soon{background:rgba(255,201,60,.14); color:var(--gold); border-color:rgba(255,201,60,.35);}
  .empty-note{color:var(--muted); font-size:13.5px; text-align:center; padding:14px 0;}

  /* Archive */
  .archive-row{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:8px 0; border-bottom:1px solid var(--border);}
  .archive-row:last-child{border-bottom:none;}
  .archive-row .a-points{color:var(--muted); flex-shrink:0;}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .topbar .who{font-size:13.5px; color:var(--muted);}
  .topbar .who b{color:var(--text);}
  .small-link{font-size:12.5px; color:var(--muted); text-decoration:none; border-bottom:1px dashed var(--muted);}

  details.pw summary{cursor:pointer; font-size:13.5px; color:var(--muted); list-style:none;}
  details.pw summary::-webkit-details-marker{display:none;}
  details.pw .pw-body{margin-top:12px;}
  .msg{font-size:13px; margin-top:6px; min-height:16px;}
  .msg.ok{color:var(--good);}
  .msg.err{color:var(--danger);}

  #app{display:none;}

  /* Tabs */
  .tab-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -ms-overflow-style:none; scrollbar-width:none;}
  .tab-row::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex-shrink:0; background:var(--card); border:1px solid var(--border); color:var(--muted);
    font-family:'Tajawal'; font-weight:800; font-size:13.5px; padding:10px 16px; border-radius:99px; cursor:pointer;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .tab-btn.active{color:#0b0b10; background:linear-gradient(90deg, var(--purple), var(--money)); border-color:transparent;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .ch-card{background:var(--card-2); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;}
  .ch-text{font-size:15px; font-weight:800; line-height:1.5;}
  .ch-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px;}
  .btn-claim{background:linear-gradient(90deg, var(--gold), #ffb03c); color:#241a00; width:100%; margin-top:10px;}
  .btn-claim:disabled{opacity:.5; cursor:default;}
  .claim-msg{font-size:12.5px; margin-top:6px; min-height:14px;}
  .claim-msg.err{color:var(--danger);}
  .claim-msg.ok{color:var(--good);}

  /* Chat */
  .chat-list{display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; padding:4px 2px; margin-bottom:10px;}
  .msg-bubble{max-width:78%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.55;}
  .msg-bubble.me{align-self:flex-end; background:linear-gradient(90deg, var(--purple), var(--money)); color:#0b0b10; border-bottom-left-radius:4px;}
  .msg-bubble.other{align-self:flex-start; background:var(--card-2); border:1px solid var(--border); border-bottom-right-radius:4px;}
  .msg-time{font-size:10.5px; opacity:.65; margin-top:4px;}
  .chat-input-row{display:flex; gap:8px;}
  .chat-input-row input{flex:1; margin-bottom:0;}
  .chat-input-row button{flex-shrink:0;}
  .msg-bubble img{display:block; max-width:180px; max-height:180px; border-radius:10px; margin-top:2px; object-fit:cover;}
  .check.locked{cursor:default; position:relative;}

  /* Notifications bell */
  .bell-btn{position:relative; background:var(--bg-soft); border:1px solid var(--border); color:var(--text); width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; padding:0;}
  .bell-badge{position:absolute; top:-5px; left:-5px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:800; border-radius:99px; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid var(--bg);}
  .topbar-right{display:flex; align-items:center; gap:8px;}
  .notif-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); font-size:13.5px;}
  .notif-row:last-child{border-bottom:none;}
  .notif-row.unseen{background:rgba(155,110,255,.08); border-radius:12px; padding:10px 8px;}
  .notif-icon{font-size:16px; flex-shrink:0;}
  .notif-time{color:var(--muted); font-size:11px; margin-top:2px;}
  .notif-dot{width:8px; height:8px; border-radius:99px; background:var(--purple); flex-shrink:0;}

  /* Photo proof */
  .photo-row{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .task-photo{display:block; max-width:150px; max-height:150px; border-radius:10px; margin-top:8px; border:1px solid var(--border); object-fit:cover;}
  .photo-status{font-size:11.5px; color:var(--muted);}

  /* Finished tasks page */
  .done-card{background:var(--card-2); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px;}
  .done-card .task-text{margin-bottom:4px;}
</style>
</head>
<body>
<div class="wrap">

  <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>

  <header>
    <div class="eyebrow">TASK HUB</div>
    <h1>Task Center</h1>
    <div class="subtitle">Leaderboard &amp; Tasks</div>
  </header>

  <!-- LOGIN -->
  <div id="loginScreen" class="card">
    <div class="section-title">🔑 Login</div>
    <label for="loginUser">Your name</label>
    <select id="loginUser"></select>
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" placeholder="••••••">
    <div class="login-err" id="loginErr"></div>
    <button class="btn-primary" id="loginBtn">Login</button>
    <div style="text-align:center; margin-top:14px;">
      
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <div class="who">Hi, <b id="whoName"></b></div>
      <div class="topbar-right">
        <button class="bell-btn" id="bellBtn" title="Notifications">🔔<span class="bell-badge" id="bellBadge" style="display:none;"></span></button>
        <button class="btn-ghost" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🏆 Leaderboard</div>
      <div id="leaderboard"></div>
    </div>

    <div class="tab-row" id="tabRow">
      <button class="tab-btn active" data-tab="tasks">✅ My Tasks</button>
      <button class="tab-btn" data-tab="done">🎉 Completed</button>
      <button class="tab-btn" data-tab="challenges">📋 Available Tasks</button>
      <button class="tab-btn" data-tab="chat">💬 Chat</button>
      <button class="tab-btn" data-tab="archive">🗂️ Archive</button>
      <button class="tab-btn" data-tab="notif">🔔 Notifications</button>
      <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
    </div>

    <div class="tab-panel active" id="panel-tasks">
      <div class="card">
        <div class="section-title">✅ My Tasks</div>
        <div id="myTasks"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-done">
      <div class="card">
        <div class="section-title">🎉 Completed Tasks</div>
        <div id="myDoneTasks"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-notif">
      <div class="card">
        <div class="section-title">🔔 Notifications</div>
        <div id="myNotifList"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-challenges">
      <div class="card">
        <div class="section-title">📋 Available Tasks</div>
        <div style="color:var(--muted); font-size:13px; margin-bottom:12px;">Open tasks anyone can claim — first to grab one removes it from the pool and adds it to their "My Tasks".</div>
        <div id="challengeList"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-chat">
      <div class="card">
        <div class="section-title">💬 Chat with Admin</div>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-input-row">
          <label class="btn-ghost" style="cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 12px;" title="Send a photo to admin">📷
            <input type="file" accept="image/*" id="chatPhotoInput" style="display:none;">
          </label>
          <input type="text" id="chatInput" placeholder="Type your message...">
          <button class="btn-ghost" id="chatSendBtn">Send</button>
        </div>
        <div class="claim-msg" id="chatPhotoStatus"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-archive">
      <div class="card">
        <div class="section-title">🗂️ Recently Completed</div>
        <div id="archive"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-settings">
      <div class="card">
        <div class="section-title">⚙️ Change Password</div>
        <label>Current password</label>
        <input type="password" id="curPass">
        <label>New password</label>
        <input type="password" id="newPass">
        <button class="btn-ghost" id="changePassBtn">Save new password</button>
        <div class="msg" id="pwMsg"></div>
      </div>
      <div style="text-align:center;">
       
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#0b0b10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

let currentUser = localStorage.getItem('arena_user') || null;

// populate login dropdown
const loginUser = document.getElementById('loginUser');
USERS.forEach(u => {
  const opt = document.createElement('option');
  opt.value = u; opt.textContent = NAMES[u];
  loginUser.appendChild(opt);
});

async function boot(){
  await ensureSeedData();
  if (currentUser) {
    const snap = await db.collection('users').doc(currentUser).get();
    if (snap.exists) { showApp(); return; }
    currentUser = null; localStorage.removeItem('arena_user');
  }
  showLogin();
}

function showLogin(){
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('whoName').textContent = NAMES[currentUser];
  listenLeaderboard();
  listenMyTasks();
  listenMyDoneTasks();
  listenArchive();
  listenChallenges();
  listenChat();
  listenMyNotifications();
}

// ---- Tabs ----
function switchTab(tabId){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tabId).classList.add('active');
  if (tabId === 'notif') {
    db.collection('user_notifications').where('user', '==', currentUser).where('seen', '==', false).get().then(snap => {
      snap.forEach(d => d.ref.update({ seen: true }));
    });
  }
}

document.getElementById('tabRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  switchTab(btn.dataset.tab);
});

document.getElementById('bellBtn').addEventListener('click', () => switchTab('notif'));

document.getElementById('loginBtn').addEventListener('click', async () => {
  const u = loginUser.value;
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  const snap = await db.collection('users').doc(u).get();
  if (!snap.exists || snap.data().password !== p) {
    errEl.textContent = 'Wrong password, try again';
    return;
  }
  currentUser = u;
  localStorage.setItem('arena_user', u);
  showApp();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  currentUser = null;
  localStorage.removeItem('arena_user');
  showLogin();
});

// ---- Leaderboard ----
function listenLeaderboard(){
  db.collection('users').onSnapshot((snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (b.points||0) - (a.points||0));
    const maxPts = Math.max(1, ...rows.map(r => r.points||0));
    const el = document.getElementById('leaderboard');
    el.innerHTML = rows.map((r, i) => {
      const color = COLORS[r.id] || '#8d8da3';
      const pct = Math.round(((r.points||0)/maxPts)*100);
      return `<div class="lb-row ${r.id===currentUser?'me':''}">
        <div class="lb-rank ${i===0?'gold':''}">${i+1}</div>
        <div class="avatar" style="background:${color}22; color:${color};">${AVATARS[r.id]||'?'}</div>
        <div class="lb-info">
          <div class="lb-name">${escapeHtml(NAMES[r.id]||r.id)}</div>
          <div class="lb-bar-track"><div class="lb-bar-fill" style="width:${pct}%; background:${color};"></div></div>
        </div>
        <div class="lb-points" style="color:${color};">${r.points||0}</div>
      </div>`;
    }).join('');
  });
}

// ---- My tasks ----
function dueChip(deadline, done){
  if (!deadline) return '';
  const due = new Date(deadline);
  const now = new Date();
  const diffMs = due - now;
  const dateStr = due.toLocaleDateString('en-US', { day:'numeric', month:'short' });
  if (done) return `<span class="due-chip">📅 ${dateStr}</span>`;
  if (diffMs < 0) return `<span class="due-chip late">Overdue · ${dateStr}</span>`;
  const days = Math.floor(diffMs / 86400000);
  if (days <= 1) return `<span class="due-chip soon">Due soon · ${dateStr}</span>`;
  return `<span class="due-chip">📅 ${days}d left · ${dateStr}</span>`;
}

function listenMyTasks(){
  const q = db.collection('tasks').where('assignedTo', '==', currentUser);
  q.onSnapshot((snap) => {
    const tasks = [];
    snap.forEach(d => { const data = d.data(); if (!data.done) tasks.push({ id: d.id, ...data }); });
    tasks.sort((a,b) => (a.deadline||'').localeCompare(b.deadline||''));
    const el = document.getElementById('myTasks');
    if (tasks.length === 0) { el.innerHTML = '<div class="empty-note">No tasks right now 🎉</div>'; return; }
    el.innerHTML = tasks.map(t => `
      <div class="task ${t.done?'done':''}">
        <div class="task-row">
          <div class="check ${t.done?'checked locked':''}" data-task="${t.id}" data-done="${t.done?1:0}">${CHECK_SVG}</div>
          <div style="flex:1;">
            <div class="task-text ${t.done?'strike':''}">${escapeHtml(t.text)}</div>
            <div class="task-chips">
              <span class="points-chip">⭐ ${t.points||0} pts</span>
              ${dueChip(t.deadline, t.done)}
              ${t.started ? '<span class="due-chip">🚀 In progress</span>' : ''}
            </div>
            ${t.done ? '<div style="font-size:11.5px; color:var(--muted); margin-top:6px;">🔒 Completed — only admin can undo</div>' : ''}
            ${(!t.done && !t.started) ? `<button class="btn-ghost" style="margin-top:8px; font-size:12.5px; padding:6px 12px;" data-start="${t.id}">🚀 Start Task</button>` : ''}
          </div>
        </div>
      </div>
    `).join('');
    el.querySelectorAll('[data-task]').forEach(elx => {
      const isDone = elx.dataset.done === '1';
      if (isDone) return; // locked, only admin can undo
      elx.addEventListener('click', async () => {
        const id = elx.dataset.task;
        const t = tasks.find(x => x.id === id);
        await db.collection('tasks').doc(id).update({ done: true, doneAt: Date.now() });
        await recalcUserPoints(currentUser);
        await db.collection('notifications').add({
          type: 'task_finished',
          user: currentUser,
          taskId: id,
          text: t ? t.text : '',
          points: t ? (t.points || 0) : 0,
          createdAt: Date.now(),
          seen: false
        });
      });
    });
    el.querySelectorAll('[data-start]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.start;
        const t = tasks.find(x => x.id === id);
        btn.disabled = true; btn.textContent = 'Starting...';
        await db.collection('tasks').doc(id).update({ started: true, startedAt: Date.now() });
        await db.collection('notifications').add({
          type: 'task_started',
          user: currentUser,
          taskId: id,
          text: t ? t.text : '',
          points: t ? t.points || 0 : 0,
          createdAt: Date.now(),
          seen: false
        });
      });
    });
  });
}

// ---- My finished tasks ----
function listenMyDoneTasks(){
  const q = db.collection('tasks').where('assignedTo', '==', currentUser).where('done', '==', true);
  q.onSnapshot((snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
    const el = document.getElementById('myDoneTasks');
    if (rows.length === 0) { el.innerHTML = '<div class="empty-note">You haven\'t completed any tasks yet, let\'s go 💪</div>'; return; }
    el.innerHTML = rows.map(t => {
      const dateStr = t.doneAt ? new Date(t.doneAt).toLocaleDateString('en-US', {day:'numeric', month:'short'}) : '';
      return `<div class="done-card">
        <div class="task-text">${escapeHtml(t.text)}</div>
        <div class="task-chips">
          <span class="points-chip">⭐ ${t.points||0} pts</span>
          <span class="due-chip">✅ Completed on ${dateStr}</span>
        </div>
        ${t.photoURL ? `<a href="${t.photoURL}" target="_blank"><img class="task-photo" src="${t.photoURL}" alt="Proof photo"></a>` : ''}
      </div>`;
    }).join('');
  });
}

// ---- My notifications (bell) ----
function listenMyNotifications(){
  db.collection('user_notifications').where('user', '==', currentUser).onSnapshot((snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const unseenCount = rows.filter(r => !r.seen).length;
    const badge = document.getElementById('bellBadge');
    if (unseenCount > 0) { badge.textContent = unseenCount; badge.style.display = 'flex'; }
    else { badge.style.display = 'none'; }
    const el = document.getElementById('myNotifList');
    if (rows.length === 0) { el.innerHTML = '<div class="empty-note">No notifications yet</div>'; return; }
    el.innerHTML = rows.map(n => {
      const icon = n.type === 'task_added' ? '📌' : '💬';
      const label = n.type === 'task_added' ? 'Admin assigned you a new task' : 'Admin sent you a message';
      const timeStr = n.createdAt ? new Date(n.createdAt).toLocaleString('en-US', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
      return `<div class="notif-row ${n.seen?'':'unseen'}" data-notif="${n.id}">
        <span class="notif-icon">${icon}</span>
        <div style="flex:1;">
          <div><b>${label}</b>${n.text ? ': ' + escapeHtml(n.text) : ''}</div>
          <div class="notif-time">${timeStr}</div>
        </div>
        ${n.seen ? '' : '<span class="notif-dot"></span>'}
      </div>`;
    }).join('');
  });
}

// ---- Archive (everyone's recent completions) ----
function listenArchive(){
  const q = db.collection('tasks').where('done', '==', true);
  q.onSnapshot((snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
    const top = rows.slice(0, 15);
    const el = document.getElementById('archive');
    if (top.length === 0) { el.innerHTML = '<div class="empty-note">No tasks completed yet</div>'; return; }
    el.innerHTML = top.map(t => {
      const dateStr = t.doneAt ? new Date(t.doneAt).toLocaleDateString('en-US', {day:'numeric', month:'short'}) : '';
      return `<div class="archive-row"><span><b>${escapeHtml(NAMES[t.assignedTo]||t.assignedTo)}</b> — ${escapeHtml(t.text)}</span><span class="a-points">${t.points||0} pts · ${dateStr}</span></div>`;
    }).join('');
  });
}

// ---- Change password ----
document.getElementById('changePassBtn').addEventListener('click', async () => {
  const cur = document.getElementById('curPass').value;
  const next = document.getElementById('newPass').value;
  const msg = document.getElementById('pwMsg');
  msg.className = 'msg'; msg.textContent = '';
  if (!next || next.length < 3) { msg.textContent = 'New password is too short'; msg.classList.add('err'); return; }
  const snap = await db.collection('users').doc(currentUser).get();
  if (snap.data().password !== cur) { msg.textContent = 'Current password is wrong'; msg.classList.add('err'); return; }
  await db.collection('users').doc(currentUser).update({ password: next });
  document.getElementById('curPass').value = '';
  document.getElementById('newPass').value = '';
  msg.textContent = 'Password changed ✅'; msg.classList.add('ok');
});

// ---- Available tasks pool (open tasks, first to claim gets it) ----
function listenChallenges(){
  db.collection('challenges').onSnapshot((snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const el = document.getElementById('challengeList');
    if (rows.length === 0) { el.innerHTML = '<div class="empty-note">No open tasks right now 🎉</div>'; return; }
    el.innerHTML = rows.map(c => `
      <div class="ch-card">
        <div class="ch-text">${escapeHtml(c.text)}</div>
        <div class="ch-chips">
          <span class="points-chip">⭐ ${c.points||0} pts</span>
          <span class="due-chip">⏰ ${fmtDeadlineFull(c.deadline)}</span>
        </div>
        <button class="btn-claim" data-claim="${c.id}">🏁 Claim it</button>
        <div class="claim-msg" id="claimMsg-${c.id}"></div>
      </div>
    `).join('');
    el.querySelectorAll('[data-claim]').forEach(btn => btn.addEventListener('click', () => claimChallenge(btn.dataset.claim, btn)));
  });
}

function fmtDeadlineFull(dl){
  if (!dl) return 'No deadline';
  const d = new Date(dl);
  return d.toLocaleString('en-US', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

async function claimChallenge(id, btn){
  btn.disabled = true;
  const msgEl = document.getElementById('claimMsg-' + id);
  msgEl.className = 'claim-msg'; msgEl.textContent = '';
  try {
    await db.runTransaction(async (txn) => {
      const chRef = db.collection('challenges').doc(id);
      const chSnap = await txn.get(chRef);
      if (!chSnap.exists) { throw new Error('TAKEN'); }
      const data = chSnap.data();
      const taskRef = db.collection('tasks').doc();
      txn.set(taskRef, {
        assignedTo: currentUser,
        text: data.text,
        points: data.points || 0,
        deadline: data.deadline || null,
        done: false,
        doneAt: null,
        createdAt: Date.now(),
        fromChallenge: true
      });
      txn.delete(chRef);
    });
    msgEl.textContent = 'Claimed! Added to "My Tasks" 🎉'; msgEl.classList.add('ok');
  } catch (e) {
    msgEl.textContent = 'Sorry, someone already claimed it 😅'; msgEl.classList.add('err');
    btn.disabled = true;
    btn.textContent = 'Taken';
  }
}

// ---- Chat with admin ----
function listenChat(){
  const q = db.collection('messages').where('user', '==', currentUser);
  q.onSnapshot((snap) => {
    const rows = [];
    snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    const el = document.getElementById('chatList');
    if (rows.length === 0) { el.innerHTML = '<div class="empty-note">Send a message to admin here</div>'; return; }
    el.innerHTML = rows.map(m => {
      const isMe = m.sender === 'user';
      const timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}) : '';
      const photoHtml = m.imageURL ? `<a href="${m.imageURL}" target="_blank"><img src="${m.imageURL}" alt="Photo"></a>` : '';
      return `<div class="msg-bubble ${isMe?'me':'other'}">${photoHtml}${m.text ? escapeHtml(m.text) : ''}<div class="msg-time">${isMe?'You':'Admin'} · ${timeStr}</div></div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  });
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await db.collection('messages').add({
    user: currentUser, sender: 'user', text, createdAt: Date.now()
  });
}
document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatMessage();
});

// ---- Send a photo to the admin (via chat) ----
document.getElementById('chatPhotoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const status = document.getElementById('chatPhotoStatus');
  status.className = 'claim-msg'; status.textContent = 'Uploading photo...';
  try {
    const url = await uploadUserPhoto(currentUser, file);
    await db.collection('messages').add({
      user: currentUser, sender: 'user', text: '', imageURL: url, createdAt: Date.now()
    });
    status.textContent = 'Sent to admin ✅'; status.classList.add('ok');
    setTimeout(() => { status.textContent = ''; status.className = 'claim-msg'; }, 2500);
  } catch (err) {
    status.textContent = 'Failed to upload photo, try again'; status.classList.add('err');
    console.error(err);
  }
});

// ---- Theme (dark / light) ----
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('arena_theme', t);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = t === 'light' ? '🌙' : '☀️';
}
applyTheme(localStorage.getItem('arena_theme') || 'dark');
document.getElementById('themeToggle').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
});

boot();
</script>
